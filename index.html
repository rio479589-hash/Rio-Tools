<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio Tools</title>
    <style>
        :root {
            /* Simple Dark Mode Theme with Light Grey Accent */
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --item-bg: #2a2a2a;
            --item-hover: #333333;
            --input-bg: #252525;
            --text-main: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-muted: #707070;
            --border-color: #383838;
            --accent: #374151;         /* Muted dark grey for primary buttons */
            --accent-hover: #4b5563;   /* Slightly lighter grey on hover */
            --accent-active: #d1d5db;  /* Light grey for active text/highlights */
            --progress-bg: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Segmented Navigation Tabs */
        .tab-nav {
            display: flex;
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
            gap: 4px;
        }

        .tab-nav.main-nav {
            background: #181818;
            border-radius: 12px;
            padding: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 16px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tab-nav.main-nav .tab-btn {
            padding: 10px 16px;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-active);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Tab Content Containers */
        .main-tab-content, .sub-tab-content {
            display: none;
        }

        .main-tab-content.active, .sub-tab-content.active {
            display: block;
            animation: fadeIn 0.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Controls */
        .control-group {
            margin-bottom: 20px;
        }

        label.title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.15s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-active);
        }

        /* Toggles */
        .toggles-container {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
            justify-content: center;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            user-select: none;
            color: var(--text-secondary);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .toggle-switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #383838;
            transition: .2s ease;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #e0e0e0;
            transition: .2s ease;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-active);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #121212;
        }

        /* Buttons */
        button.action-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-active);
            border: 1px solid var(--border-color);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-primary:active { transform: translateY(1px); }

        .btn-secondary {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            margin-top: 14px;
        }

        .btn-secondary:hover {
            background: var(--item-hover);
        }

        /* Results List (SpeedTAS) */
        #results {
            margin-top: 20px;
            max-height: 240px;
            overflow-y: auto;
            border-radius: 8px;
            padding-right: 4px;
        }

        #results::-webkit-scrollbar { width: 6px; }
        #results::-webkit-scrollbar-track { background: transparent; }
        #results::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .track-item {
            padding: 10px 14px;
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.2s ease forwards;
            opacity: 0;
            transform: translateY(8px);
        }

        .track-item:hover {
            background: var(--item-hover);
            transform: translateX(4px) !important;
        }

        .track-item a {
            color: var(--accent-active);
            text-decoration: none;
            font-weight: 600;
            background: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid var(--border-color);
            transition: all 0.15s;
        }

        .track-item a:hover {
            background: var(--accent-hover);
        }

        /* Timer UI */
        .timer-card {
            background: #181818;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            margin: 5px 0;
        }

        .timer-status {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-active);
            margin-bottom: 12px;
        }

        .progress-container {
            background: var(--progress-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            height: 10px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent-active);
            border-radius: 6px;
            transition: width 0.2s linear;
        }

        .timer-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .spacebar-hint {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 600;
        }

        .spacebar-key {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            padding: 1px 6px;
            border-radius: 4px;
            color: var(--text-main);
        }

        .timer-actions { display: flex; gap: 10px; }
        .timer-actions button { flex: 1; }

        /* Inputs Grid UI */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background: var(--item-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            background: var(--item-hover);
        }

        .trick-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            background: #181818;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .card .btn-primary { padding: 8px; font-size: 12px; margin-top: auto; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            </div>

        document.getElementById(tabId).classList.add('active');
        element.classList.add('active');

    let currentSelection = [];

    function generateLinks() {
        const s1Checked = document.getElementById('toggleS1').checked;
        const s2Checked = document.getElementById('toggleS2').checked;
        const amount = parseInt(document.getElementById('amount').value);
        const resultsDiv = document.getElementById('results');
        const openAllBtn = document.getElementById('openAllBtn');

        resultsDiv.innerHTML = '';
        currentSelection = [];
        openAllBtn.style.display = 'none';

        if (isNaN(amount) || amount <= 0) {
            resultsDiv.innerHTML = '<div class="track-item" style="color: #ef4444; justify-content: center;">Please enter a valid number.</div>';
            return;
        }

        let pool = [];
        if (s1Checked) pool = pool.concat(season1);
        if (s2Checked) pool = pool.concat(season2);

        if (pool.length === 0) {
            resultsDiv.innerHTML = '<div class="track-item" style="color: #ef4444; justify-content: center;">Please select at least one season.</div>';
            return;
        }

        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        currentSelection = pool.slice(0, Math.min(amount, pool.length));

        currentSelection.forEach((track, index) => {
            const trackDiv = document.createElement('div');
            trackDiv.className = 'track-item';
            trackDiv.style.animationDelay = `${index * 0.03}s`;
            trackDiv.innerHTML = `<span>${track.name}</span> <a href="${track.url}" target="_blank">View</a>`;
            resultsDiv.appendChild(trackDiv);
        });

        if (currentSelection.length > 0) {
            openAllBtn.style.display = 'block';
        }
    }

    function openAllLinks() {
        if (currentSelection.length > 0) {
            currentSelection.forEach(track => {
                window.open(track.url, '_blank');
            });
        }
    }


    // --- TIMER LOGIC ---
    let totalSeconds = 40 * 60;
    let remainingSeconds = 40 * 60;
    let timerInterval = null;
    let isRunning = false;

    function formatTime(secs) {
        const mins = Math.floor(secs / 60);
        const s = secs % 60;
        return `${mins.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateTimerUI() {
        const display = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const elapsedSpan = document.getElementById('timeElapsed');
        const percentSpan = document.getElementById('timePercent');

        display.textContent = formatTime(remainingSeconds);

        const elapsedSeconds = totalSeconds - remainingSeconds;
        elapsedSpan.textContent = `${formatTime(elapsedSeconds)} elapsed`;

        const percentage = totalSeconds > 0 ? (remainingSeconds / totalSeconds) * 100 : 0;
        progressBar.style.width = `${Math.max(0, percentage)}%`;
        percentSpan.textContent = `${Math.round(percentage)}% remaining`;
    }

    function setCustomTime() {
        if (isRunning) pauseTimer();
        const inputMins = parseInt(document.getElementById('timerDuration').value);
        if (!isNaN(inputMins) && inputMins > 0) {
            totalSeconds = inputMins * 60;
            remainingSeconds = totalSeconds;
            document.getElementById('timerStatus').textContent = 'Ready';
            updateTimerUI();
        }
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (remainingSeconds <= 0) return;
        isRunning = true;
        document.getElementById('startPauseBtn').textContent = 'Pause';
        document.getElementById('timerStatus').textContent = 'Running';
        
        timerInterval = setInterval(() => {
            if (remainingSeconds > 0) {
                remainingSeconds--;
                updateTimerUI();
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                document.getElementById('startPauseBtn').textContent = 'Start';
                document.getElementById('timerStatus').textContent = 'Completed';
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        document.getElementById('startPauseBtn').textContent = 'Resume';
        document.getElementById('timerStatus').textContent = 'Paused';
    }

    function resetTimer() {
        pauseTimer();
        const inputMins = parseInt(document.getElementById('timerDuration').value) || 40;
        totalSeconds = inputMins * 60;
        remainingSeconds = totalSeconds;
        document.getElementById('startPauseBtn').textContent = 'Start';
        document.getElementById('timerStatus').textContent = 'Ready';
        updateTimerUI();
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === ' ') {
            const activeTag = document.activeElement.tagName.toLowerCase();
            if (activeTag === 'input' || activeTag === 'textarea') return;
            e.preventDefault();
            // Only trigger if timer section is active
            if(document.getElementById('speedtas-section').classList.contains('active') && document.getElementById('practiceTab').classList.contains('active')) {
                toggleTimer();
            }
        }
    });

    updateTimerUI();


    // --- INPUTS LOGIC ---
    const INPUT_FILES_DIR = 'input files';

    let currentDir = 'l';
    let trick5Ver = '1';

    function setDirection(dir) {
        currentDir = dir;
        document.getElementById('btn-l').classList.toggle('active', dir === 'l');
        document.getElementById('btn-r').classList.toggle('active', dir === 'r');
    }

    function setTrick5Version(ver) {
        trick5Ver = ver;
        document.getElementById('v1-btn').classList.toggle('active', ver === '1');
        document.getElementById('v2-btn').classList.toggle('active', ver === '2');
    }

    async function copyInputs(trickNum, buttonEl) {
        const fileKey = trickNum === 5 ? `5-${trick5Ver}-${currentDir}` : `${trickNum}-${currentDir}`;
        const fileName = `${fileKey}.txt`;
        const filePath = `${INPUT_FILES_DIR}/${fileName}`;

        try {
            const response = await fetch(filePath);
            if (!response.ok) {
                throw new Error(`Failed to fetch ${filePath}: ${response.status} ${response.statusText}`);
            }
            const textContent = await response.text();
            
            await navigator.clipboard.writeText(textContent);

            const originalText = buttonEl.textContent;
            buttonEl.textContent = 'Copied!';
            buttonEl.style.backgroundColor = '#4b5563';

            setTimeout(() => {
                buttonEl.textContent = originalText;
                buttonEl.style.backgroundColor = '';
            }, 1500);

        } catch (err) {
            console.error(err);
            alert(`Could not copy "${fileName}". Make sure the "input files" folder is next to index.html and contains this file.`);
        }
    }
